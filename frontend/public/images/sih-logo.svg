<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Tricolor Gradient -->
    <linearGradient id="tricolor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#128807" />
    </linearGradient>
    <!-- Background Circle Radial Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
  </defs>

  <!-- Outer background circle -->
  <circle cx="100%" cy="100%" r="95" fill="url(#bg-glow)" stroke="#334155" stroke-width="2" />

  <!-- Inner glow ring -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#tricolor)" stroke-width="3" opacity="0.8" />

  <!-- Abstract Network Nodes representing Hackathon/Technology -->
  <g stroke="#64748b" stroke-width="1.5" opacity="0.6">
    <line x1="100" y1="50" x2="60" y2="100" />
    <line x1="100" y1="50" x2="140" y2="100" />
    <line x1="60" y1="100" x2="100" y2="150" />
    <line x1="140" y1="100" x2="100" y2="150" />
    <line x1="60" y1="100" x2="140" y2="100" />
  </g>

  <!-- Tech Dots -->
  <circle cx="100" cy="50" r="6" fill="#FF9933" />
  <circle cx="60" cy="100" r="6" fill="#2563eb" />
  <circle cx="140" cy="100" r="6" fill="#2563eb" />
  <circle cx="100" cy="150" r="6" fill="#128807" />

  <!-- Central Badge -->
  <circle cx="100" cy="100" r="32" fill="#2563eb" shadow="0 4px 6px rgba(0,0,0,0.3)" />
  <circle cx="100" cy="100" r="28" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />

  <!-- SIH Text -->
  <text x="100" y="107" font-family="system-ui, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="1">SIH</text>

  <!-- Subtitle -->
  <text x="100" y="180" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#e2e8f0" text-anchor="middle" letter-spacing="2">SMART INDIA</text>
</svg>
