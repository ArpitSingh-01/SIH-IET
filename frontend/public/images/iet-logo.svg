<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Deep Blue Radial Glow -->
    <radialGradient id="univ-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <!-- Gold Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#univ-glow)" stroke="url(#gold)" stroke-width="2" />

  <!-- Inner border ring -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#e2e8f0" stroke-width="1" opacity="0.3" />

  <!-- Gear/Cogwheel (representing Engineering) -->
  <g fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.45" transform="translate(100,100)">
    <circle cx="0" cy="0" r="28" />
    <circle cx="0" cy="0" r="18" />
    <!-- Gear teeth -->
    <path d="M-6 -34 L6 -34 L4 -28 L-4 -28 Z" />
    <path d="M-6 -34 L6 -34 L4 -28 L-4 -28 Z" transform="rotate(45)" />
    <path d="M-6 -34 L6 -34 L4 -28 L-4 -28 Z" transform="rotate(90)" />
    <path d="M-6 -34 L6 -34 L4 -28 L-4 -28 Z" transform="rotate(135)" />
    <path d="M-6 -34 L6 -34 L4 -28 L-4 -28 Z" transform="rotate(180)" />
    <path d="M-6 -34 L6 -34 L4 -28 L-4 -28 Z" transform="rotate(225)" />
    <path d="M-6 -34 L6 -34 L4 -28 L-4 -28 Z" transform="rotate(270)" />
    <path d="M-6 -34 L6 -34 L4 -28 L-4 -28 Z" transform="rotate(315)" />
  </g>

  <!-- Large Initials (IET) -->
  <text x="100" y="98" font-family="system-ui, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="1">IET</text>

  <!-- University initials -->
  <text x="100" y="125" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="url(#gold)" text-anchor="middle" letter-spacing="1.5">DDUGU</text>

  <!-- Subtitle -->
  <text x="100" y="165" font-family="system-ui, sans-serif" font-weight="600" font-size="9" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">GORAKHPUR</text>
</svg>
